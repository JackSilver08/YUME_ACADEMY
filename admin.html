<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Quản lý Bài Viết</title>
<style>
  body { font-family: Arial; padding: 20px; max-width: 700px; margin: auto; }
  input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
  button { padding: 10px 15px; margin-top: 5px; }
  .preview-img { width: 150px; margin-top: 10px; display: none; }
  .post-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
  .post-item img { width: 120px; display: block; margin-bottom: 5px; }
</style>
</head>
<body>

<h1>Quản Lý Bài Viết</h1>

<h2>Tạo Bài Viết Mới</h2>
<form id="postForm">
  <label>Tiêu đề bài viết</label>
  <input type="text" id="title" required>

  <label>Link bài viết Facebook</label>
  <input type="text" id="link" placeholder="https://facebook.com/..." required>

  <label>Thumbnail</label>
  <input type="file" id="thumbnail" accept="image/*" required>
  <img id="preview" class="preview-img" />

  <button type="submit">Publish</button>
</form>

<hr>

<h2>Danh sách bài viết</h2>
<div id="postsList">Đang tải...</div>

<script>
/* CONFIG */
const CLOUD_NAME = "dlfuhehxg";
const UPLOAD_PRESET = "Thumbnail_YUME"; // Unsigned
const POSTS_JSON_URL = "https://raw.githubusercontent.com/JackSilver08/YUME_ACADEMY/main/posts.json";

let posts = [];

/* Load posts hiện tại */
async function loadPosts() {
  try {
    const res = await fetch(POSTS_JSON_URL);
    posts = await res.json();
    renderPosts();
  } catch (e) {
    console.error(e);
    posts = [];
    document.getElementById("postsList").innerHTML = "<p>Chưa có bài viết nào.</p>";
  }
}

/* Render danh sách bài viết */
function renderPosts() {
  const container = document.getElementById("postsList");
  if (!posts.length) {
    container.innerHTML = "<p>Chưa có bài viết nào.</p>";
    return;
  }
  posts.sort((a,b)=> new Date(b.date) - new Date(a.date));
  container.innerHTML = '';
  posts.forEach(p => {
    const div = document.createElement("div");
    div.className = "post-item";
    div.innerHTML = `
      <img src="${p.thumbnail}" alt="${p.title}">
      <b>${p.title}</b><br>
      <a href="${p.link}" target="_blank">Xem bài viết</a><br>
      <small>${new Date(p.date).toLocaleString()}</small>
    `;
    container.appendChild(div);
  });
}

/* Upload ảnh lên Cloudinary */
async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET); // Unsigned
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method: "POST",
    body: formData
  });
  if (!res.ok) throw new Error("Upload thất bại!");
  return await res.json();
}

document.getElementById("postForm").onsubmit = async function(e){
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  const link = document.getElementById("link").value.trim();
  const file = document.getElementById("thumbnail").files[0];

  if(!title || !link || !file) return alert("Vui lòng nhập đầy đủ thông tin và chọn ảnh!");

  try {
    // 1️⃣ Upload thumbnail
    const upload = await uploadToCloudinary(file);
    const thumbnailUrl = upload.secure_url;

    // 2️⃣ Tạo bài viết mới
    const id = posts.length===0 ? 1 : Math.max(...posts.map(p=>p.id))+1;
    const newPost = { id, title, link, thumbnail: thumbnailUrl, date: new Date().toISOString() };
    posts.push(newPost);

    // 3️⃣ Upload JSON online
    const jsonUpload = await uploadJSONToCloudinary(posts);
    console.log("URL JSON mới:", jsonUpload.secure_url);

    renderPosts();
    this.reset();
    document.getElementById("preview").style.display="none";

    alert("Đăng bài thành công! JSON online đã được cập nhật.");
  } catch(err) {
    console.error(err);
    alert("Upload thất bại!");
  }
};


/* Preview ảnh */
document.getElementById("thumbnail").onchange = function(){
  const img = document.getElementById("preview");
  img.src = URL.createObjectURL(this.files[0]);
  img.style.display="block";
};

loadPosts();
</script>


</body>
</html>
