<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Quản lý Bài Viết</title>
<style>
  body { font-family: Arial; padding: 20px; max-width: 700px; margin: auto; }
  input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
  button { padding: 10px 15px; margin-top: 5px; }
  .preview-img { width: 150px; margin-top: 10px; display: none; }
  .post-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
  .post-item img { width: 120px; display: block; margin-bottom: 5px; }
</style>
</head>
<body>

<h1>Quản Lý Bài Viết</h1>

<h2>Tạo Bài Viết Mới</h2>
<form id="postForm">
  <label>Tiêu đề bài viết</label>
  <input type="text" id="title" required>

  <label>Link bài viết Facebook</label>
  <input type="text" id="link" placeholder="https://facebook.com/..." required>

  <label>Thumbnail</label>
  <input type="file" id="thumbnail" accept="image/*" required>
  <img id="preview" class="preview-img" />

  <button type="submit">Publish</button>
</form>

<hr>

<h2>Danh sách bài viết</h2>
<div id="postsList"></div>

<script>
const POSTS_FILE = 'posts.json'; // file cục bộ
let posts = [];

// Load posts từ file JSON local
async function loadPosts() {
  try {
    const res = await fetch(POSTS_FILE);
    posts = await res.json();
    renderPosts();
  } catch (e) {
    console.error(e);
    posts = [];
    document.getElementById("postsList").innerHTML = "<p>Chưa có bài viết nào.</p>";
  }
}

// Render danh sách bài viết
function renderPosts() {
  const container = document.getElementById("postsList");
  if(posts.length === 0){
    container.innerHTML = "<p>Chưa có bài viết nào.</p>";
    return;
  }

  // Sắp xếp theo date mới → cũ
  posts.sort((a,b) => new Date(b.date) - new Date(a.date));

  container.innerHTML = '';
  posts.forEach(p => {
    const div = document.createElement("div");
    div.className = 'post-item';
    div.innerHTML = `
      <img src="${p.thumbnail}" alt="${p.title}">
      <b>${p.title}</b><br>
      <a href="${p.link}" target="_blank">Xem bài viết</a><br>
      <small>${new Date(p.date).toLocaleString()}</small>
    `;
    container.appendChild(div);
  });
}

// Tạo id mới tự động
function getNextId() {
  return posts.length === 0 ? 1 : Math.max(...posts.map(p=>p.id)) + 1;
}

// Preview ảnh
document.getElementById("thumbnail").onchange = function() {
  const img = document.getElementById("preview");
  img.src = URL.createObjectURL(this.files[0]);
  img.style.display = "block";
}

// Submit form
document.getElementById("postForm").onsubmit = function(e){
  e.preventDefault();

  const title = document.getElementById("title").value.trim();
  const link = document.getElementById("link").value.trim();
  const fileInput = document.getElementById("thumbnail");
  const file = fileInput.files[0];

  if(!title || !link || !file) return alert("Vui lòng nhập đủ thông tin và chọn ảnh!");

  // Tạo URL tạm thời cho thumbnail (local preview)
  const thumbnailUrl = URL.createObjectURL(file);

  const newPost = {
    id: getNextId(),
    title,
    link,
    thumbnail: thumbnailUrl,
    date: new Date().toISOString()
  };

  posts.push(newPost);
  renderPosts();

  // Reset form
  this.reset();
  document.getElementById("preview").style.display = "none";

  alert("Đã thêm bài viết mới (local)!");
  
  // Lưu vào posts.json: cần server local để ghi file (Live Server)
  // fetch + PUT/POST không được trên file local do browser chặn
  console.log("Posts hiện tại:", posts);
}

loadPosts();
</script>

</body>
</html>
