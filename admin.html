<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Yume Academy</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, textarea { width: 300px; margin-bottom: 10px; }
    button { margin-right: 5px; }
    .post { border-bottom: 1px solid #ccc; margin-bottom: 10px; padding-bottom: 10px; }
  </style>
</head>
<body>
<h1>Admin – Quản lý bài viết</h1>

<h2>Tạo/Sửa bài viết</h2>
<form id="postForm">
  <input type="text" id="title" placeholder="Tiêu đề" required><br>
  <input type="date" id="date" required><br>
  <input type="text" id="thumbnail" placeholder="Đường dẫn ảnh"><br>
  <input type="text" id="video" placeholder="Link video (YouTube/Cloudinary)"><br>
  <textarea id="body" placeholder="Nội dung (HTML)" rows="5"></textarea><br>
  <button type="submit">Publish</button>
</form>

<h2>Danh sách bài viết</h2>
<div id="postsList"></div>

<script>
// === Cấu hình GitHub ===
const repo = "JackSilver08/YUME_ACADEMY";
const branch = "main";
const folder = "posts";
const token = "YOUR_PERSONAL_ACCESS_TOKEN"; // <-- Thay bằng token của bạn

let posts = []; // cache bài viết

// Hàm fetch danh sách bài JSON từ GitHub
async function loadPosts(){
  const res = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}?ref=${branch}`, {
    headers: { Authorization: `token ${token}` }
  });
  const files = await res.json();
  posts = [];
  for(const file of files){
    if(file.name.endsWith(".json")){
      const r = await fetch(file.download_url);
      const post = await r.json();
      post._filename = file.name; // lưu tên file để edit/delete
      posts.push(post);
    }
  }
  renderPosts();
}

// Render danh sách bài viết
function renderPosts(){
  const container = document.getElementById("postsList");
  container.innerHTML = "";
  posts.sort((a,b)=> new Date(b.date)-new Date(a.date)); // mới nhất lên đầu
  posts.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <strong>${p.title}</strong> (${p.date}) <br>
      <button onclick="editPost(${i})">Edit</button>
      <button onclick="deletePost(${i})">Delete</button>
    `;
    container.appendChild(div);
  });
}

// Commit JSON lên GitHub
async function commitPost(post, filename, message){
  const url = `https://api.github.com/repos/${repo}/contents/${folder}/${filename}`;
  // Kiểm tra xem file đã tồn tại chưa
  const resCheck = await fetch(url, { headers: { Authorization: `token ${token}` } });
  let sha = null;
  if(resCheck.status===200){
    const data = await resCheck.json();
    sha = data.sha;
  }
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      message: message,
      content: btoa(JSON.stringify(post, null, 2)),
      branch: branch,
      sha: sha
    })
  });
  return await res.json();
}

// Xử lý form submit
document.getElementById("postForm").onsubmit = async function(e){
  e.preventDefault();
  const title = document.getElementById("title").value;
  const date = document.getElementById("date").value;
  const thumbnail = document.getElementById("thumbnail").value;
  const video = document.getElementById("video").value;
  const body = document.getElementById("body").value;
  const filename = `${date}-${title.replace(/\s+/g,"-")}.json`;

  const post = {title,date,thumbnail,video,body};

  const res = await commitPost(post, filename, `Add/Update post: ${title}`);
  console.log(res);
  alert("Bài viết đã được publish!");
  this.reset();
  loadPosts();
}

// Edit bài viết
window.editPost = function(i){
  const p = posts[i];
  document.getElementById("title").value = p.title;
  document.getElementById("date").value = p.date;
  document.getElementById("thumbnail").value = p.thumbnail;
  document.getElementById("video").value = p.video;
  document.getElementById("body").value = p.body;
}

// Delete bài viết
window.deletePost = async function(i){
  if(!confirm("Bạn có chắc muốn xóa bài này?")) return;
  const post = posts[i];
  const url = `https://api.github.com/repos/${repo}/contents/${folder}/${post._filename}`;
  const resCheck = await fetch(url, { headers: { Authorization: `token ${token}` } });
  if(resCheck.status===200){
    const data = await resCheck.json();
    const res = await fetch(url, {
      method: "DELETE",
      headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Delete post: ${post.title}`,
        sha: data.sha,
        branch: branch
      })
    });
    console.log(res);
    alert("Bài viết đã bị xóa!");
    loadPosts();
  }
}

// Load danh sách khi mở admin
loadPosts();

</script>
</body>
</html>
