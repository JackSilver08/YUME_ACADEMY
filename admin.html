<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Quản lý Bài Viết</title>
<style>
  body { font-family: Arial; padding: 20px; max-width: 700px; margin: auto; }
  input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
  button { padding: 10px 15px; margin-top: 5px; }
  .preview-img { width: 150px; margin-top: 10px; display: none; }
  .post-item { border-bottom: 1px solid #ccc; padding: 10px 0; }
  .post-item img { width: 120px; display: block; margin-bottom: 5px; }
</style>
</head>
<body>

<h1>Quản Lý Bài Viết</h1>

<h2>Tạo Bài Viết Mới</h2>
<form id="postForm">
  <label>Tiêu đề bài viết</label>
  <input type="text" id="title" required>

  <label>Link bài viết Facebook</label>
  <input type="text" id="link" placeholder="https://facebook.com/..." required>

  <label>Thumbnail</label>
  <input type="file" id="thumbnail" accept="image/*" required>
  <img id="preview" class="preview-img" />

  <button type="submit">Publish</button>
</form>

<hr>

<h2>Danh sách bài viết</h2>
<div id="postsList"></div>

<script>
/* ------------- CONFIG ------------- */
const repo = "JackSilver08/YUME_ACADEMY"; 
const branch = "main";
const postsFile = "posts.json";
const TOKEN = "YOUR_PERSONAL_ACCESS_TOKEN"; // <- điền token ở đây

// Cloudinary config
const CLOUD_NAME = "dlfuhehxg";
const UPLOAD_PRESET = "Thumbnail_YUME";

let posts = [];

/* ------------- Load posts hiện tại ------------- */
async function loadPosts() {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${repo}/${branch}/${postsFile}`);
    posts = await res.json();
    renderPosts();
  } catch(e) {
    console.error(e);
    posts = [];
    document.getElementById("postsList").innerHTML = "<p>Chưa có bài viết nào.</p>";
  }
}

function renderPosts() {
  const container = document.getElementById("postsList");
  if(posts.length === 0){
    container.innerHTML = "<p>Chưa có bài viết nào.</p>";
    return;
  }
  posts.sort((a,b)=> new Date(b.date) - new Date(a.date));
  container.innerHTML = '';
  posts.forEach(p=>{
    const div = document.createElement("div");
    div.className = "post-item";
    div.innerHTML = `
      <img src="${p.thumbnail}" alt="${p.title}">
      <b>${p.title}</b><br>
      <a href="${p.link}" target="_blank">Xem bài viết</a><br>
      <small>${new Date(p.date).toLocaleString()}</small>
    `;
    container.appendChild(div);
  });
}

/* ------------- Upload ảnh lên Cloudinary ------------- */
async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method: "POST",
    body: formData
  });
  return await res.json();
}

/* ------------- Commit posts.json lên GitHub ------------- */
async function updatePostsOnGitHub(newPosts){
  const url = `https://api.github.com/repos/${repo}/contents/${postsFile}`;
  const check = await fetch(url, { headers:{ Authorization:`Bearer ${TOKEN}` } });
  const old = await check.json();
  const res = await fetch(url, {
    method:"PUT",
    headers: { "Authorization": `Bearer ${TOKEN}`, "Content-Type":"application/json" },
    body: JSON.stringify({
      message: "Update posts.json",
      content: btoa(JSON.stringify(newPosts,null,2)),
      sha: old.sha,
      branch
    })
  });
  return await res.json();
}

/* ------------- Submit form ------------- */
document.getElementById("postForm").onsubmit = async function(e){
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  const link = document.getElementById("link").value.trim();
  const file = document.getElementById("thumbnail").files[0];
  if(!title || !link || !file) return alert("Vui lòng nhập đầy đủ thông tin và chọn ảnh!");

  const upload = await uploadToCloudinary(file);
  const thumbnailUrl = upload.secure_url;

  const id = posts.length===0 ? 1 : Math.max(...posts.map(p=>p.id))+1;
  const newPost = { id, title, link, thumbnail: thumbnailUrl, date: new Date().toISOString() };
  posts.push(newPost);

  await updatePostsOnGitHub(posts);

  alert("Đăng bài thành công!");
  renderPosts();
  this.reset();
  document.getElementById("preview").style.display="none";
}

/* ------------- Preview ảnh ------------- */
document.getElementById("thumbnail").onchange = function(){
  const img = document.getElementById("preview");
  img.src = URL.createObjectURL(this.files[0]);
  img.style.display="block";
}

loadPosts();
</script>

</body>
</html>
