<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Yume Academy</title>
<style>
  body { font-family: Arial; padding: 20px; }
  input, textarea { width: 300px; margin-bottom: 10px; }
  button { margin-right: 5px; }
  .post { border-bottom: 1px solid #ccc; margin-bottom: 10px; padding-bottom: 10px; }
</style>
</head>
<body>

<h1>Admin – Quản lý bài viết</h1>

<h2>Tạo/Sửa bài viết</h2>
<form id="postForm">
  <input type="text" id="title" placeholder="Tiêu đề" required><br>
  <input type="date" id="date" required><br>
  <input type="text" id="thumbnail" placeholder="Đường dẫn ảnh"><br>
  <input type="text" id="video" placeholder="Link video (YouTube/Cloudinary)"><br>
  <textarea id="body" placeholder="Nội dung (HTML)" rows="5"></textarea><br>
  <button type="submit">Publish</button>
</form>

<h2>Danh sách bài viết</h2>
<div id="postsList"></div>

<script>
const repo = "JackSilver08/YUME_ACADEMY";
const branch = "main";
const folder = "posts";

let token = prompt("Nhập GitHub Personal Access Token của bạn:");
if(!token) alert("Bạn chưa nhập token! Không thể tải bài viết.");

let posts = [];

// Load bài viết từ GitHub
async function loadPosts(){
  if(!token) return;
  try {
    const res = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}?ref=${branch}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if(!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const files = await res.json();
    posts = [];
    for(const file of files){
      if(file.name.endsWith(".json")){
        const r = await fetch(file.download_url);
        const post = await r.json();
        post._filename = file.name;
        posts.push(post);
      }
    }
    renderPosts();
  } catch(err){
    console.error(err);
    alert("Không thể load bài viết. Kiểm tra token và quyền repo.");
  }
}

// Render danh sách bài viết
function renderPosts(){
  const container = document.getElementById("postsList");
  container.innerHTML = "";
  posts.sort((a,b)=> new Date(b.date)-new Date(a.date));
  posts.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <strong>${p.title}</strong> (${p.date}) <br>
      <button onclick="editPost(${i})">Edit</button>
      <button onclick="deletePost(${i})">Delete</button>
    `;
    container.appendChild(div);
  });
}

// Commit bài viết lên GitHub
async function commitPost(post, filename, message){
  const url = `https://api.github.com/repos/${repo}/contents/${folder}/${filename}`;
  let sha = null;
  const resCheck = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if(resCheck.ok){
    const data = await resCheck.json();
    sha = data.sha;
  }
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({
      message,
      content: btoa(JSON.stringify(post,null,2)),
      branch,
      sha
    })
  });
  return await res.json();
}

// Submit form
document.getElementById("postForm").onsubmit = async function(e){
  e.preventDefault();
  const title = document.getElementById("title").value.trim();
  const date = document.getElementById("date").value;
  const thumbnail = document.getElementById("thumbnail").value.trim();
  const video = document.getElementById("video").value.trim();
  const body = document.getElementById("body").value.trim();
  if(!title || !date) return alert("Tiêu đề và ngày không được để trống.");
  const filename = `${date}-${title.replace(/\s+/g,"-")}.json`;
  const post = {title,date,thumbnail,video,body};
  try{
    await commitPost(post, filename, `Add/Update post: ${title}`);
    alert("Bài viết đã được publish!");
    this.reset();
    loadPosts();
  }catch(err){
    console.error(err);
    alert("Không thể publish. Kiểm tra token và repo.");
  }
}

// Edit bài viết
window.editPost = function(i){
  const p = posts[i];
  document.getElementById("title").value = p.title;
  document.getElementById("date").value = p.date;
  document.getElementById("thumbnail").value = p.thumbnail;
  document.getElementById("video").value = p.video;
  document.getElementById("body").value = p.body;
}

// Delete bài viết
window.deletePost = async function(i){
  if(!confirm("Bạn có chắc muốn xóa bài này?")) return;
  const post = posts[i];
  const url = `https://api.github.com/repos/${repo}/contents/${folder}/${post._filename}`;
  const resCheck = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if(resCheck.ok){
    const data = await resCheck.json();
    await fetch(url,{
      method:"DELETE",
      headers:{ "Authorization": `Bearer ${token}`, "Content-Type":"application/json" },
      body: JSON.stringify({ message:`Delete post: ${post.title}`, sha: data.sha, branch })
    });
    alert("Bài viết đã bị xóa!");
    loadPosts();
  } else alert("Không tìm thấy bài viết trên repo.");
}

// Load danh sách khi mở admin
loadPosts();

</script>
</body>
</html>
