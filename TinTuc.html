<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tin tức – Yume Academy</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f7f7f7; }
  .news-container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { text-align: center; margin-bottom: 30px; }

  .post-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    margin-bottom: 25px;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .post-card:hover { transform: translateY(-3px); }

  .post-thumb {
    width: 100%;
    display: block;
    object-fit: cover;
    max-height: 400px;
  }

  .post-content { padding: 15px; }
  .post-title { font-size: 22px; font-weight: bold; color: #333; margin: 10px 0 5px; }
  .post-date { color: #777; font-size: 14px; margin-bottom: 10px; }

  a.read-more {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: #ff2e63;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }
  a.read-more:hover { background: #e02655; }
</style>
</head>
<body>

<div class="news-container">
  <h1>Tin tức Yume Academy</h1>
  <div id="news">Đang tải bài viết...</div>
</div>

<script>
const POSTS_JSON_URL = "https://raw.githubusercontent.com/JackSilver08/YUME_ACADEMY/main/posts.json";

async function loadNews() {
  const container = document.getElementById("news");
  try {
    const res = await fetch(POSTS_JSON_URL);
    const posts = await res.json();
    if (!posts.length) { container.innerHTML = "<p>Hiện chưa có bài viết nào.</p>"; return; }

    posts.sort((a,b)=> new Date(b.date) - new Date(a.date));
    container.innerHTML = '';
    posts.forEach(p=>{
      container.innerHTML += `
        <div class="post-card">
          <img src="${p.thumbnail}" class="post-thumb">
          <div class="post-title">${p.title}</div>
          <div class="post-date">${new Date(p.date).toLocaleDateString("vi-VN")}</div>
          <a class="read-more" href="${p.link}" target="_blank">Xem chi tiết →</a>
        </div>
      `;
    });
  } catch(err) {
    console.error(err);
    container.innerHTML = "<p>Không thể tải tin tức.</p>";
  }
}

loadNews();
</script>

</body>
</html>
